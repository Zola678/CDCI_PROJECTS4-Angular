<div class="auth-page">
  <div class="auth-card reveal visible">
    <div class="logo" routerLink="/">OPEN BOX</div>
    <h2>Criar nova conta</h2>
    <p class="subtitle">Junte-se à elite da tecnologia e multimédia</p>

    <form (ngSubmit)="onRegister()">
      <div class="form-group">
        <label>Nome Completo</label>
        <input
          type="text"
          placeholder="O seu nome"
          [(ngModel)]="name"
          name="name"
          required
        />
      </div>

      <div class="form-group">
        <label>E-mail</label>
        <input
          type="email"
          placeholder="exemplo@openbox.com"
          [(ngModel)]="email"
          name="email"
          required
        />
      </div>

      <div class="form-group">
        <label>Palavra-passe</label>
        <input
          type="password"
          placeholder="Mínimo 6 caracteres"
          [(ngModel)]="password"
          name="password"
          required
        />
      </div>

      <div class="form-group">
        <label>Confirmar Palavra-passe</label>
        <input
          type="password"
          placeholder="••••••••"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          required
        />
      </div>

      <button type="submit" [disabled]="loading" class="btn-primary">
        <span *ngIf="!loading">Criar Conta</span>
        <span *ngIf="loading">A criar...</span>
      </button>
    </form>

    <div class="error-msg" *ngIf="error">
      {{ error }}
    </div>

    <div class="success-msg" *ngIf="success">
      {{ success }}
    </div>

    <div class="auth-footer">
      Já tem uma conta? <a routerLink="/login">Fazer login</a>
    </div>
  </div>
</div>
