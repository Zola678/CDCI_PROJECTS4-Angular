<div class="auth-page">
  <div class="auth-card reveal visible">
    <div class="logo" routerLink="/">OPEN BOX</div>
    <h2>Bem-vindo de volta</h2>
    <p class="subtitle">Aceda à sua conta profissional</p>

    <form (ngSubmit)="onLogin()">
      <div class="form-group">
        <label>E-mail</label>
        <input
          type="email"
          placeholder="exemplo@openbox.com"
          [(ngModel)]="email"
          name="email"
          required
        />
      </div>

      <div class="form-group">
        <label>Palavra-passe</label>
        <input
          type="password"
          placeholder="••••••••"
          [(ngModel)]="password"
          name="password"
          required
        />
      </div>

      <button type="submit" [disabled]="loading" class="btn-primary">
        <span *ngIf="!loading">Entrar</span>
        <span *ngIf="loading">A processar...</span>
      </button>
    </form>

    <div class="error-msg" *ngIf="error">
      {{ error }}
    </div>

    <div class="auth-footer">
      Ainda não tem conta? <a routerLink="/register">Criar conta grátis</a>
    </div>
  </div>
</div>
