<nav class="navbar">
  <div class="logo">OPEN BOX</div>
  <div class="links">
    <a routerLink="/user">Painel</a>
    <a routerLink="/user/products">Serviços & Produtos</a>
    <a routerLink="/user/profile" class="active">Perfil</a>
  </div>
  <div class="user-info">
    <span>{{ user.email }}</span>
    <button (click)="logout()" class="btn-logout">Sair</button>
  </div>
</nav>

<div class="profile-container reveal visible">
  <header class="profile-header">
    <h1>O Seu <span style="color: var(--primary)">Perfil Profissional</span></h1>
    <p>Informações da sua conta na Open Box Corporation.</p>
  </header>

  <div class="profile-card">
    <div class="avatar-large">
      {{ user.name.charAt(0).toUpperCase() }}
    </div>
    
    <div class="profile-details">
      <div class="detail-group">
        <label>Nome Completo</label>
        <div class="value">{{ user.name }}</div>
      </div>

      <div class="detail-group">
        <label>Endereço de E-mail</label>
        <div class="value">{{ user.email }}</div>
      </div>

      <div class="detail-group">
        <label>Nível de Acesso</label>
        <div class="value">
          <span class="role-tag" [class.admin]="user.role === 'admin'">{{ user.role }}</span>
        </div>
      </div>
    </div>

    <div class="profile-actions">
      <button class="btn-secondary" (click)="goBack()">Voltar ao Painel</button>
      <button routerLink="/user/settings" class="btn-primary">Definições da Conta</button>
    </div>
  </div>
</div>
