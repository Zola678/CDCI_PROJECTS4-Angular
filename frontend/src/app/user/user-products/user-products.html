<nav class="navbar">
  <div class="logo">OPEN BOX</div>
  <div class="links">
    <a routerLink="/user">Painel</a>
    <a routerLink="/user/products" class="active">Serviços & Produtos</a>
    <a routerLink="/user/profile">Perfil</a>
  </div>
</nav>

<div class="container reveal visible">
  <header class="page-header">
    <h1>Catálogo de <span style="color: var(--primary)">Multimédia & Tecnologia</span></h1>
    <p>Soluções de elite para os seus projetos digitais.</p>
  </header>

  <div class="alert-success" *ngIf="successMessage">
    <span class="icon">✅</span> {{ successMessage }}
  </div>

  <div class="grid">
    <div class="card product-card" *ngFor="let item of multimediaItems; trackBy: trackById">
      <div class="category-tag">{{ item.category === 'service' ? 'Serviço' : 'Hardware' }}</div>
      <h3>{{ item.name }}</h3>
      <p>{{ item.description }}</p>
      
      <div class="card-footer">
        <span class="price">{{ item.price | currency:'USD' }}</span>
        <button class="btn-primary" (click)="buy(item)">Adquirir</button>
      </div>
    </div>
  </div>
</div>
